services:
  - type: web
    name: signalos
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: signalos-db
          property: connectionString

databases:
  - name: signalos-db
    plan: free
