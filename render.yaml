services:
  - type: web
    name: signalos
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: MAX_USERS
        sync: false
      - key: AI_BRIDGE_URL
        sync: false
      - key: AI_BRIDGE_TOKEN
        sync: false
      - key: OLLAMA_MODEL
        value: llama3.1:8b
