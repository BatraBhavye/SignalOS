name: CI

on:
  push:
    branches:
      - main
      - feat/devops-mcp-upgrade
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run linter
        run: ruff check .

      - name: Lint shell scripts
        run: shellcheck scripts/*.sh

      - name: Run test suite
        run: pytest tests/ -v

  docker-build-and-scan:
    name: Docker Build & Vulnerability Scan
    runs-on: ubuntu-24.04
    needs: lint-and-test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image locally
        run: docker build -t signalos:ci .

      - name: Run container smoke test
        run: |
          docker run -d --name signalos-smoke -p 8000:8000 -e SESSION_SECRET=ci-smoke-test-secret-key-32-chars signalos:ci
          if ! bash scripts/healthcheck.sh http://127.0.0.1:8000/health; then
            echo "Smoke test healthcheck failed! Printing container logs:" >&2
            docker logs signalos-smoke >&2
            exit 1
          fi

      - name: Clean up smoke test container
        if: always()
        run: docker rm -f signalos-smoke

      - name: Scan Docker image with Trivy
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.58.1 image \
            --format json \
            --output /dev/stdout \
            --exit-code 0 \
            --severity CRITICAL,HIGH \
            signalos:ci > trivy-results.json

      - name: Upload Trivy Scan Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-results
          path: trivy-results.json
          retention-days: 7

      - name: Setup Open Policy Agent (OPA)
        uses: open-policy-agent/setup-opa@v2
        with:
          version: '0.70.0'

      - name: Test OPA security policies
        run: opa test policies/ -v

      - name: Verify Trivy report exists and is non-empty
        run: test -s trivy-results.json

      - name: Evaluate container scan against security gate policy
        run: |
          opa eval --fail-defined --format pretty -i trivy-results.json -d policies/ 'data.signalos.security.deny[_]'

